<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MYOP — JazzPoint</title>
  <meta name="description" content="JazzPoint MYOP: budget, redistribution, KPI assignment and campaign performance.">
  <meta name="theme-color" content="#17130f">
  <link rel="icon" href="assets/jazzpoint-logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- ANALYTICS / TAG MANAGER SNIPPET -->

<body>

<!-- Icon sprite: see index.html for the full, commented set of symbols this project uses. -->
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 9v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/></symbol>
  <symbol id="icon-myop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></symbol>
  <symbol id="icon-commission" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
  <symbol id="icon-float" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></symbol>
  <symbol id="icon-bar-chart-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
  <symbol id="icon-dollar-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 14.5c0 1 1 1.5 2.5 1.5s2.5-.6 2.5-1.6c0-2.4-5-1-5-3.4 0-1 1-1.6 2.5-1.6s2.5.5 2.5 1.5"/><path d="M12 8v1M12 15v1"/></symbol>
  <symbol id="icon-distribute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V12"/><path d="M12 12H6v3"/><path d="M12 12h6v3"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/></symbol>
  <symbol id="icon-bar-chart-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M9 19V5M14 19v-7M19 19V11"/></symbol>
  <symbol id="icon-trending-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></symbol>
</svg>

<div class="app">

  <!-- ========== Page header (frosted glass, back button + title) ========== -->
  <header class="page-header">
    <a class="page-header__back" href="index.html" aria-label="Back to home">
      <svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"></use></svg>
    </a>
    <h1 class="page-header__title">MYOP</h1>
  </header>

  <main class="page-content">
    <!-- MYOP hub: campaign performance sub-screens. selectItem targets are stubs today
         (data-action + comment), matching the design reference — build sub-pages as they're spec'd. -->
    <ul class="list-rows">
      <li>
        <button class="list-row" type="button" data-action="open-stub" data-id="my-budget">
          <span class="list-row__main">
            <span class="list-row__icon"><svg class="icon" aria-hidden="true"><use href="#icon-dollar-circle"></use></svg></span>
            <span class="list-row__label">My Budget</span>
          </span>
          <span class="list-row__go"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg></span>
        </button>
      </li>
      <li>
        <button class="list-row" type="button" data-action="open-stub" data-id="redistribution">
          <span class="list-row__main">
            <span class="list-row__icon"><svg class="icon" aria-hidden="true"><use href="#icon-distribute"></use></svg></span>
            <span class="list-row__label">Budget Re-Distribution</span>
          </span>
          <span class="list-row__go"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg></span>
        </button>
      </li>
      <li>
        <button class="list-row" type="button" data-action="open-stub" data-id="assign-kpi">
          <span class="list-row__main">
            <span class="list-row__icon"><svg class="icon" aria-hidden="true"><use href="#icon-bar-chart-2"></use></svg></span>
            <span class="list-row__label">Assign KPI</span>
          </span>
          <span class="list-row__go"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg></span>
        </button>
      </li>
      <li>
        <button class="list-row" type="button" data-action="open-stub" data-id="performance">
          <span class="list-row__main">
            <span class="list-row__icon"><svg class="icon" aria-hidden="true"><use href="#icon-trending-up"></use></svg></span>
            <span class="list-row__label">Performance</span>
          </span>
          <span class="list-row__go"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg></span>
        </button>
      </li>
    </ul>
  </main>

  <!-- ========== Bottom nav ========== -->
  <nav class="bottom-nav" aria-label="Primary">
    <span class="bottom-nav__indicator" aria-hidden="true"></span>
    <a href="index.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg><span class="bottom-nav__label">Home</span></a>
    <a href="myop.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-myop"></use></svg><span class="bottom-nav__label">MYOP</span></a>
    <a href="commission.html"><svg class="icon" aria-hidden="true"><use href="#icon-commission"></use></svg><span class="bottom-nav__label">Commission</span></a>
    <a href="float.html"><svg class="icon" aria-hidden="true"><use href="#icon-float"></use></svg><span class="bottom-nav__label">Float</span></a>
    <a href="hierarchy-performance.html"><svg class="icon" aria-hidden="true"><use href="#icon-bar-chart-3"></use></svg><span class="bottom-nav__label">Performance</span></a>
  </nav>
